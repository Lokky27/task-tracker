databaseChangeLog:
  - changeSet:
      id: init_report_service_tables
      author: vlokky
      changes:
        - createTable:
            schemaName: reporting_schema
            tableName: report
            remarks: "Отчет"
            columns:
              - column:
                  name: report_id
                  type: uuid
                  remarks: "ID отчета"
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: report_pk
              - column:
                  name: report_name
                  type: varchar(255)
                  remarks: "Название отчета"
                  constraints:
                    nullable: false
              - column:
                  name: generation_date
                  type: timestamp
                  remarks: "Дата формирования"
                  defaultValueComputed: now()
              - column:
                  name: report_data
                  type: jsonb
                  remarks: "Данные отчета"