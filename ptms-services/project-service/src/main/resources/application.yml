spring:
  application:
    name: project-service

  datasource:
    url: jdbc:postgresql://localhost:5432/task_tracker_db
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        default_schema: project_service_schema

  liquibase:
    enabled: false

  main:
    allow-bean-definition-overriding: true

logging:
  level:
    liquibase: DEBUG
server:
  port: 8484
