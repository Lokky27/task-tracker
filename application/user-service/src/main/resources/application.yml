spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/task_tracker_db
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: user_details_service_schema

  main:
    allow-bean-definition-overriding: true

  liquibase:
    change-log: classpath:/db/changelog/user-service/user_details_master_changelog.yaml
    enabled: true
    default-schema: user_details_service_schema

logging:
  level:
    liquibase: DEBUG
    org.springframework.web: DEBUG
server:
  port: 8081
