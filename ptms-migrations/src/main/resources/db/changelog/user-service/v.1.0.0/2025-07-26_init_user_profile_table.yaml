databaseChangeLog:
  - changeSet:
      id: init_user_profile_table
      author: vlokky
      changes:
        - createTable:
            tableName: user_profile
            schemaName: user_details_service_schema
            remarks: "Пользователи"
            columns:
              - column:
                  name: user_profile_id
                  type: uuid
                  remarks: "ID пользователя"
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_user_profile
              - column:
                  name: keycloak_id
                  type: uuid
                  remarks: "ID keycloak"
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: varchar(100)
                  remarks: "Электронная почта"
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: varchar(50)
                  remarks: "Имя"
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(100)
                  remarks: "Фамилия"
                  constraints:
                    nullable: false
              - column:
                  name: middle_name
                  type: varchar(100)
                  remarks: "Отчество"
              - column:
                  name: avatar_url
                  type: varchar(500)
                  remarks: "URL аватарки"
              - column:
                  name: timezone
                  type: varchar(50)
                  remarks: "Таймзона"
                  defaultValue: 'UTC'
              - column:
                  name: language
                  type: varchar(5)
                  remarks: "Язык"
                  defaultValue: 'en'
              - column:
                  name: phone
                  type: varchar(20)
                  remarks: "Номер телефона"
              - column:
                  name: is_active
                  type: boolean
                  remarks: "Активен ли пользователь"
                  defaultValue: "true"
                  constraints:
                    nullable: false
              - column:
                  name: is_email_verified
                  type: boolean
                  remarks: "Адрес эл. почты подтвержден (Да/Нет)"
                  defaultValue: 'false'
              - column:
                  name: last_login_at
                  type: timestamp
                  remarks: "Дата последнего входа"
              - column:
                  name: password_changed_at
                  type: timestamp
                  remarks: "Дата смены пароля"
              - column:
                  name: created_at
                  type: timestamp
                  remarks: "Дата создания"
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: "Дата обновления"
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  remarks: "Кем создано"
              - column:
                  name: updated_by
                  type: uuid
                  remarks: "Кем обновлено"
              - column:
                  name: version
                  type: int
                  remarks: "Версия"
                  defaultValue: '1'
              - column:
                  name: deleted_at
                  type: timestamp
                  remarks: "Дата удаления"