databaseChangeLog:
  - changeSet:
      id: init_user_preferences_table
      author: vlokky
      changes:
        - createTable:
            schemaName: user_details_service_schema
            tableName: user_preferences
            remarks: "Пользовательские настройки"
            columns:
              - column:
                  name: user_profile_id
                  type: uuid
                  remarks: "ID профиля пользователя"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_preferences
                    nullable: false
              - column:
                  name: theme
                  type: int
                  remarks: "Настройка темы (Светлая - 1, Темная - 2, Авто - 0)"
                  defaultValue: '0'
              - column:
                  name: date_format
                  type: varchar(20)
                  remarks: "Формат даты"
                  defaultValue: 'MM/dd/yyyy'
              - column:
                  name: type_format
                  type: int
                  remarks: "Тип времени (12h - 1, 24h - 2)"
                  defaultValue: '2'
              - column:
                  name: notification_enabled
                  type: boolean
                  remarks: "Включены уведомления (Да/Нет)"
                  defaultValue: 'true'
              - column:
                  name: weakly_digest_enabled
                  type: boolean
                  remarks: "Подписка на еженедельную рассылку"
                  defaultValue: 'true'
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: "Дата обновления"
                  defaultValueComputed: now()
        - addForeignKeyConstraint:
            constraintName: fk_user_preferences_user_profile
            baseTableName: user_preferences
            baseColumnNames: user_profile_id
            baseTableSchemaName: user_details_service_schema
            referencedTableName: user_profile
            referencedColumnNames: user_profile_id
            referencedTableSchemaName: user_details_service_schema
            deleteCascade: true